[package]
name = "meetbot"
version = "0.1.0"
edition = "2024"
description = "Rust drop-in replacement for the self-hosted Vexa Lite meeting-bot API"

[lib]
name = "meetbot"
path = "src/lib.rs"

[[bin]]
name = "meetbot"
path = "src/main.rs"

[dependencies]
# HTTP server
axum = "0.8"
tokio = { version = "1.53.0", features = ["full"] }

# Browser automation over CDP. 0.9 is tokio-only; there is no `tokio-runtime`
# feature any more, the runtime is no longer selectable.
chromiumoxide = "0.9.1"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
# chromiumoxide's `Handler` and `EventStream` are `futures::Stream`s that the
# caller has to drive; it does not re-export the trait, so meet.rs needs
# `futures::StreamExt` directly. Already in the tree via chromiumoxide.
futures = "0.3"

# Persistence. `bundled` compiles SQLite in, so there is no system dependency.
rusqlite = { version = "0.40.1", features = ["bundled"] }

# whisper-server client (multipart upload of WAV, JSON response)
reqwest = { version = "0.13.4", features = ["json", "multipart"] }

# Serialization + config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.3"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

# Audio (RIFF/WAVE encode + decode)
hound = "3.5.1"

# Logging + errors
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0.104"
thiserror = "2.0.19"

[profile.release]
opt-level = 3
lto = "thin"
